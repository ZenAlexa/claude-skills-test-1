  <!-- Initials -->
  <text x="100" y="100"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="48"
        font-weight="500"
        fill="#4A90E2"
        text-anchor="middle"
        dominant-baseline="central"
        opacity="0.9">
